      .entity text{font:17px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#17212b}
      .entity .heading{font:bold 21px system-ui;fill:#102a43}
      .links path{fill:none;stroke:#087f8c;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="background" width="1160" height="760" rx="12"/>
  <g class="links">
