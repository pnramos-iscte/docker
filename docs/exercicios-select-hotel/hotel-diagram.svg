    <g transform="translate(430 55)"><rect width="260" height="210"/><text class="heading" x="18" y="28">Quarto</text><text x="18" y="58">PK, FK Sigla_Hotel</text><text x="18" y="84">PK Numero_Quarto</text><text x="18" y="110">Numero_Camas</text><text x="18" y="136">Preco</text></g>
