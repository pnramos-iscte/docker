<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc">
  <title id="title">Diagrama relacional da base de dados Hotel</title>
  <desc id="desc">Oito tabelas ligadas pelas respetivas chaves estrangeiras.</desc>
  <defs>
